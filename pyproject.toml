[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscroll"
dynamic = ["version"]
description = "Fast scrolling maps library for pygame"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
authors = [
    {name = "bitcraft", email = "leif.theden@gmail.com"}
]
classifiers = [
        "Intended Audience :: Developers",
        "Development Status :: 5 - Production/Stable",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Topic :: Games/Entertainment",
        "Topic :: Multimedia :: Graphics",
        "Topic :: Software Development :: Libraries :: pygame",
]
requires-python = ">=3.9"
# pygame is intentionally NOT a hard dependency so that pygame-ce users can
# install pyscroll without pulling in pygame. Pick a backend via an extra.

[project.optional-dependencies]
pygame = ["pygame>=2.0"]
pygame-ce = ["pygame-ce>=2.1"]
tiled = ["pytmx>=3.32"]

[project.urls]
source = "https://github.com/bitcraft/pyscroll"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
# pyscroll.__version__ is a tuple, e.g. (2, 31); setuptools joins it as "2.31".
version = {attr = "pyscroll.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pyscroll*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
line_length = 88
profile = "black"
skip_gitignore = true